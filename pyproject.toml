[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "puppytalk-api"
version = "1.0.0"
description = "FastAPI 기반의 커뮤니티 백엔드 API 서버"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kyjness", email = "kyjness@naver.com" }]
keywords = ["fastapi", "api", "community", "backend"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic[email]>=2.11.0",
    "python-dotenv>=1.0.0",
    "bcrypt==4.1.2",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "python-multipart>=0.0.27",
    "boto3>=1.28.0",
    "gunicorn>=21.0.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "pyjwt>=2.12.0,<3",
    "alembic>=1.13.0",
    "python-ulid>=2.7.0",
    "uuid7>=0.1.0",
    "pydantic-settings>=2.14.2",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "pip-audit>=2.0.0",
    "poethepoet>=0.29.0",
    "pyright>=1.1.0",
    "ruff>=0.15.5",
    "vulture>=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pycodestyle, Pyflakes, isort, pyupgrade
fixable = ["ALL"]
ignore = ["E501"]  # line length은 format에서 처리

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = false  # app.* 등 런타임 경로는 IDE/CI에서 제외 가능

# 데드코드 스캔: min_confidence=100 은 vulture가 확신도 100%인 항목만 보고(오탐 줄임, 대신 놓칠 수 있음).
[tool.vulture]
min_confidence = 100
paths = ["app"]
exclude = ["**/migrations/versions/*.py"]
# RedisLike Protocol(app/infra/redis.py)의 파라미터 — 본문이 ...뿐이라 미사용으로 오탐.
ignore_names = ["nx", "ex", "seconds", "script", "numkeys", "field", "amount"]

[tool.uv]
constraint-dependencies = [
    "mako>=1.3.12",
    "urllib3>=2.7.0",
]

# Poe the Poet: `uv sync --extra dev` 후 `uv run poe <task>` 로 실행 (내부는 python -m 고정).
[tool.poe.tasks]
run = "python3 -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
celery-worker = "celery -A app.core.celery:celery_app worker -Q default,high_priority -l info --concurrency=2"
celery-beat = "celery -A app.core.celery:celery_app beat -l info"
migrate = "python3 -m alembic upgrade head"

# 전체 스택 로컬 실행 (인프라 docker + 백엔드·프론트 호스트 reload). 자세한 옵션은 dev.sh 참고.
stack = "bash dev.sh"
stack-backend = "bash dev.sh --backend-only"
stack-docker = "bash dev.sh --docker"
stack-down = "bash dev.sh --down"

lint = "python3 -m ruff check . --fix"
format = "python3 -m ruff format ."
quality = ["lint", "format"]

lint-check = "python3 -m ruff check ."
format-check = "python3 -m ruff format . --check"
typecheck = "python3 -m pyright"
vulture-check = "python3 -m vulture"
# 감사 대상은 설치된 환경이 아니라 uv.lock에서 뽑는다 — pip freeze는 venv 밖에서 돌면
# 시스템 site-packages를 그대로 집어와 엉뚱한 패키지 집합을 감사한다.
# pip은 락에만 있고 배포물에 실리지 않으므로 제외.
# --quiet: -o로 파일을 써도 stdout에 전체 목록을 한 번 더 뱉어 check 출력이 묻힌다.
audit-export = "uv export --quiet --frozen --no-emit-project --no-emit-package pip --no-hashes --no-annotate --all-extras --format requirements-txt -o .audit-requirements.txt"
audit-run = "python3 -m pip_audit -r .audit-requirements.txt --no-deps --disable-pip --ignore-vuln CVE-2026-4539"
audit-clean = "rm -f .audit-requirements.txt"
audit = ["audit-export", "audit-run", "audit-clean"]

check = ["lint-check", "format-check", "typecheck", "vulture-check", "audit"]

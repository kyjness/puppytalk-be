name: CD

# 배포만 담당한다 — 이미지 빌드·푸시는 ci.yml의 docker 잡이 main 푸시마다 이미 하고 있다.
# 여기서는 서버에 "새 이미지를 받아 다시 띄워라"만 지시한다.
#
# 왜 SSH인가: 데모 서버가 Lightsail이라 IAM 인스턴스 롤을 붙일 수 없고, 따라서
# GitHub OIDC → ssm:SendCommand 로 가는 무키 배포 경로를 쓸 수 없다. 정적 시크릿(배포 전용
# SSH 키) 하나를 감수하는 선택이며 근거는 docs/adr/0017-demo-deployment-topology.md 에 있다.
# 프론트 배포(S3 sync + CloudFront 무효화)는 그대로 OIDC를 쓴다.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 배포는 취소하지 않고 줄을 세운다 — 중간에 끊기면 컨테이너가 어중간한 상태로 남는다.
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: 서버 재배포
    # workflow_dispatch에는 conclusion이 없으므로 CI 성공 조건과 OR로 묶는다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # 배포 자격이 없는 포크·시크릿 미설정 상태에서 CD가 매번 빨간 X를 남기지 않게 한다.
      # 없는 시크릿은 빈 문자열로 주입되므로 ssh가 "@"로 호출돼 실패하는데, 그건 설정
      # 부재지 회귀가 아니다 — 건너뛰고 성공으로 끝낸 뒤 이유를 요약에 남긴다.
      # (secrets 컨텍스트는 잡 레벨 if에서 못 쓴다. 그래서 스텝 출력으로 게이트한다.)
      - name: 배포 자격 확인
        id: gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          missing=""
          for key in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER HEALTH_URL; do
            [ -n "${!key}" ] || missing="${missing} ${key}"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=배포 건너뜀::배포 시크릿 미설정 —${missing}. 워크플로는 성공으로 끝낸다."
            {
              echo "### 배포 건너뜀"
              echo
              echo "다음 시크릿이 없어 서버 재배포를 실행하지 않았다:"
              for key in $missing; do echo "- \`${key}\`"; done
              echo
              echo "전부 등록하면 다음 main 푸시부터 자동으로 배포된다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH 자격 준비
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # ssh-keyscan 결과를 그대로 넣는다. StrictHostKeyChecking=no 대신 이걸 쓰는 이유는
          # 배포 키를 아무 호스트에나 내주지 않기 위해서다(중간자 방지).
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: GHCR 이미지 pull 후 재기동
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -eu -o pipefail -s' <<'REMOTE'
          cd /opt/puppytalk
          docker compose --env-file .env.prod -f compose.prod.yml pull
          docker compose --env-file .env.prod -f compose.prod.yml up -d
          # 이전 태그의 이미지가 60GB 디스크를 야금야금 먹는다.
          docker image prune -f
          REMOTE

      - name: 헬스 체크
        if: steps.gate.outputs.ready == 'true'
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          # 마이그레이션 후 gunicorn이 뜰 시간을 준다. readyz는 DB·Redis 연결까지 본다.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null; then
              echo "정상 기동 확인 (${attempt}회차)"
              exit 0
            fi
            sleep 5
          done
          echo "헬스 체크 실패 — 서버에서 docker compose logs backend 확인 필요" >&2
          exit 1

version: 2

# PR은 전부 develop으로 받는다. Dependabot의 기본 대상은 기본 브랜치(main)인데, 그러면
# main에만 락파일이 앞서서 다음 develop→main 머지가 uv.lock에서 충돌한다(실제로 겪었다).
# 통합 브랜치는 develop 하나로 유지한다.
#
# 보안 업데이트(Settings의 Dependabot security updates)는 target-branch를 따르지 않고
# 항상 기본 브랜치(main)로 열린다 — 그래서 꺼 두고, 보안 알림을 보고 develop에서 직접
# 락을 올린다. 여기 설정은 정기 버전 업데이트에만 적용된다.
updates:
  # 액션은 커밋 SHA로 고정돼 있어 스스로 갱신되지 않는다 — 그래서 버전 업데이트를 켠다.
  # 고정(공급망)과 최신성(보안 패치)은 세트로만 성립한다.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]
    # 액션 하나당 PR 하나면 리뷰가 산만하다 — 마이너·패치는 묶는다.
    groups:
      actions:
        update-types: [minor, patch]

